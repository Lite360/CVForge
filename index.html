<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CVForge — Create professional CVs, optimize them with AI, check ATS compatibility, and export as PDF or DOCX. Free CV builder with recruiter-approved templates." />
    <meta name="theme-color" content="#F97316" />
    <title>CVForge — Create a Professional CV. Optimize It With AI.</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
        });
      }
    </script>
  </body>
</html>
